name: Release MODL

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Use tag as module version
        id: version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$TAG_NAME" ]; then
            echo "Tag name is empty"
            exit 1
          fi
          echo "value=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Build MODL
        run: mvn -B -ntp -Drevision=${{ steps.version.outputs.value }} package

      - name: Create GitHub Release and upload MODL
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: esphome-device-build/target/*.modl
